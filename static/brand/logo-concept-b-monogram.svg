<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" fill="none" role="img" aria-label="ELEVA LOCKER  conceito B: monograma E modular">
  <!-- Conceito B: letra E formada por faixas de compartimento -->
  <rect width="120" height="120" rx="20" fill="#E8EDF3"/>
  <!-- haste vertical -->
  <rect x="28" y="24" width="14" height="72" rx="4" fill="#0C2F52"/>
  <!-- prateleira superior -->
  <rect x="28" y="24" width="58" height="14" rx="4" fill="#0C2F52"/>
  <!-- prateleira meio (recuo intencional  não simétrico) -->
  <rect x="28" y="53" width="46" height="14" rx="4" fill="#157A6E"/>
  <!-- prateleira inferior -->
  <rect x="28" y="82" width="62" height="14" rx="4" fill="#0C2F52"/>
  <!-- slot aberto  acento cobre -->
  <rect x="78" y="53" width="14" height="14" rx="3" fill="#C17F3A"/>
  <!-- gap entre slots (negative space) -->
  <rect x="86" y="24" width="6" height="14" rx="1" fill="#E8EDF3"/>
</svg>
