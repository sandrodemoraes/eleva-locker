<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 120" fill="none" role="img" aria-label="eleva Soluções Tecnológicas">
  <!-- Recriação vetorial da logo atual  símbolo + wordmark -->
  <g transform="translate(8, 12)">
    <!-- losango central = espaço negativo (fundo branco) -->
    <!-- forma esquerda -->
    <path d="M8 48 L36 8 L68 8 L40 48 Z" fill="#134736" stroke="#134736" stroke-linejoin="round"/>
    <path d="M8 48 L36 88 L68 88 L40 48 Z" fill="#134736" stroke="#134736" stroke-linejoin="round"/>
    <!-- forma direita (sobreposição) -->
    <path d="M28 48 L56 8 L88 8 L60 48 Z" fill="#0F3D31"/>
    <path d="M28 48 L56 88 L88 88 L60 48 Z" fill="#0F3D31"/>
    <!-- arredondamento visual nos vértices externos via máscara suave -->
    <rect x="20" y="36" width="20" height="24" rx="2" fill="#FFFFFF"/>
  </g>
  <text x="112" y="62" font-family="'Nunito', 'Varela Round', 'Segoe UI', sans-serif" font-size="52" font-weight="700" fill="#134736">eleva</text>
  <text x="114" y="88" font-family="'Segoe UI', 'IBM Plex Sans', sans-serif" font-size="11" font-weight="600" fill="#134736" letter-spacing="3.2">SOLUÇÕES TECNOLÓGICAS</text>
</svg>
