<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" fill="none" role="img" aria-label="ELEVA LOCKER  conceito A: grade de compartimentos">
  <!-- Conceito A: compartimentos + elevação (porta aberta, degrau ascendente) -->
  <rect width="120" height="120" rx="20" fill="#0C2F52"/>
  <!-- coluna esquerda (2 células) -->
  <rect x="22" y="58" width="24" height="22" rx="3" fill="#1E4A7A"/>
  <rect x="22" y="82" width="24" height="22" rx="3" fill="#1E4A7A"/>
  <!-- coluna central (3 células  ascensão) -->
  <rect x="48" y="46" width="24" height="22" rx="3" fill="#157A6E"/>
  <rect x="48" y="70" width="24" height="22" rx="3" fill="#1E4A7A"/>
  <rect x="48" y="94" width="24" height="8" rx="2" fill="#1E4A7A"/>
  <!-- coluna direita  porta aberta (gap + traco cobre) -->
  <rect x="74" y="34" width="24" height="22" rx="3" fill="#1E4A7A"/>
  <rect x="74" y="58" width="24" height="22" rx="3" fill="#1E4A7A"/>
  <path d="M98 58v22" stroke="#C17F3A" stroke-width="3" stroke-linecap="round"/>
  <rect x="74" y="82" width="24" height="22" rx="3" fill="#1E4A7A"/>
  <!-- detalhe cobre  elevar -->
  <path d="M22 52 L60 28 L98 40" stroke="#C17F3A" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
</svg>
