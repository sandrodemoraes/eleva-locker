<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}LGPD{% endblock %} | ELEVA LOCKER</title>
    <link rel="icon" href="{{ url_for('static', filename='brand/logo-eleva-locker-icon.svg') }}" type="image/svg+xml">
    <link rel="stylesheet" href="{{ url_for('static', filename='vendor/nunito/nunito.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='vendor/fontawesome/css/all.min.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/lgpd-public.css') }}">
</head>
<body>
    <header class="lgpd-header">
        <a href="/totem/2" class="lgpd-brand">
            <img src="{{ url_for('static', filename='brand/logo-eleva-locker-icon.svg') }}" alt="">
            <span>ELEVA LOCKER</span>
        </a>
        <nav class="lgpd-nav">
            <a href="{{ url_for('lgpd.index') }}"{% if pagina == 'lgpd' %} class="ativa"{% endif %}>Seus dados</a>
            <a href="{{ url_for('lgpd.privacidade') }}"{% if pagina == 'privacidade' %} class="ativa"{% endif %}>Privacidade</a>
            <a href="{{ url_for('lgpd.termos') }}"{% if pagina == 'termos' %} class="ativa"{% endif %}>Termos</a>
        </nav>
    </header>

    <main class="lgpd-main">
        {% block content %}{% endblock %}
    </main>

    <footer class="lgpd-footer">
        <p>Versão da política: {{ lgpd_versao }} · {{ lgpd_controlador }}</p>
        <p>
            <a href="/totem/2"><i class="fa-solid fa-tablet-screen-button"></i> Voltar ao totem</a>
        </p>
    </footer>
</body>
</html>
