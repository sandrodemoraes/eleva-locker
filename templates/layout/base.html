<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>
        {% block title %}
            ELEVA LOCKER
        {% endblock %}
    </title>

    <!-- CSS Global -->
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/layout.css') }}">

    <!-- Font Awesome (local — sem depender de CDN) -->
    <link rel="stylesheet"
          href="{{ url_for('static', filename='vendor/fontawesome/css/all.min.css') }}">

    {% block styles %}
    {% endblock %}
</head>

<body>

    <div class="app">

        <!-- Navbar -->
        <header class="topbar">
            {% include 'layout/navbar.html' %}
        </header>

        <!-- Sidebar -->
        <aside class="sidebar-container">
            {% include 'layout/sidebar.html' %}
        </aside>

        <!-- Conteúdo -->
        <main class="content">

            {% block content %}
            {% endblock %}

        </main>

    </div>

    <!-- JQuery (local — sem depender de CDN) -->
    <script src="{{ url_for('static', filename='vendor/jquery-3.7.1.min.js') }}"></script>

    <!-- Scripts específicos -->
    {% block scripts %}
    {% endblock %}

</body>

</html>
