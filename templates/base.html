<!DOCTYPE html>
<html lang="pt-BR">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>ELEVA LOCKER</title>

<link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial, Helvetica, sans-serif;
}

body{
    background:#edf2f7;
}

.topo{

    height:70px;

    background:#134736;

    display:flex;

    align-items:center;

    justify-content:space-between;

    padding:0 25px;

    color:white;

    font-size:24px;

    font-weight:bold;

    box-shadow:0 2px 10px rgba(0,0,0,.15);

}

.container{

    display:flex;

    height:calc(100vh - 70px);

}

.sidebar{

    width:250px;

    background:#0F3D31;

    color:white;

    padding-top:20px;

}

.sidebar a{

    display:block;

    padding:15px 25px;

    text-decoration:none;

    color:white;

    transition:.3s;

}

.sidebar a:hover{

    background:#134736;

}

.conteudo{

    flex:1;

    padding:30px;

    overflow:auto;

}

.card{

    background:white;

    border-radius:10px;

    padding:20px;

    box-shadow:0 5px 20px rgba(0,0,0,.12);

    margin-bottom:20px;

}

</style>

</head>

<body>

<div class="topo">

    <div>
        ELEVA LOCKER
    </div>

    <div>
        {{ usuario }}
    </div>

</div>

<div class="container">

    <div class="sidebar">

        <a href="/dashboard">🏠 Dashboard</a>

        <a href="/usuarios">👤 Usuários</a>

        <a href="/empresas">🏢 Empresas</a>

        <a href="/armarios">📦 Armários</a>

        <a href="/esp32">🤖 ESP32</a>

        <a href="/compartimentos">📬 Compartimentos</a>

        <a href="/encomendas">📦 Encomendas</a>

        <a href="/monitoramento">📊 Monitoramento</a>

        <a href="/relatorios">📋 Relatórios</a>

        <a href="/configuracoes">⚙ Configurações</a>

        <a href="/logout">🚪 Sair</a>

    </div>

    <div class="conteudo">

        {% block conteudo %}

        {% endblock %}

    </div>

</div>

</body>

</html>
