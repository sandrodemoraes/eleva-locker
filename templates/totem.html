<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="mobile-web-app-capable" content="yes">
    <title>ELEVA LOCKER — Totem</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/totem.css') }}">
    <link rel="manifest" href="{{ url_for('static', filename='manifest.json') }}">
</head>
<body>

<div class="totem" data-armario-id="{{ armario.id if armario else '' }}">

    <!-- TELA 1 — Início -->
    <section id="tela-inicio" class="tela tela-ativa">
        <div class="totem-logo">
            <i class="fa-solid fa-box"></i>
            <h1>ELEVA LOCKER</h1>
            {% if armario %}
            <p class="totem-local"><i class="fa-solid fa-location-dot"></i> {{ armario.nome }}</p>
            {% elif armarios %}
            <select id="selArmario" class="totem-select" onchange="if(this.value) location.href='/totem/'+this.value">
                <option value="">Selecione o armário</option>
                {% for a in armarios %}
                <option value="{{ a.id }}">{{ a.nome }}</option>
                {% endfor %}
            </select>
            {% endif %}
        </div>

        <button type="button" class="btn-totem btn-principal" onclick="irRetirar()" {% if not armario and armarios %}disabled{% endif %}>
            <i class="fa-solid fa-hand-holding-box"></i>
            Retirar encomenda
        </button>

        <p class="totem-dica">Use o código enviado no seu WhatsApp</p>
        <div class="totem-footer">ELEVA LOCKER © 2026</div>
    </section>

    <!-- TELA 2 — Digitar código -->
    <section id="tela-retirar" class="tela">
        <button type="button" class="btn-voltar" onclick="irInicio()"><i class="fa-solid fa-arrow-left"></i> Voltar</button>
        <h2 class="tela-titulo">Digite o código</h2>
        <p class="tela-sub">6 dígitos do WhatsApp</p>

        <div class="codigo-display" id="display">_ _ _ _ _ _</div>

        <div class="teclado">
            <button type="button" class="tecla" onclick="digitar('1')">1</button>
            <button type="button" class="tecla" onclick="digitar('2')">2</button>
            <button type="button" class="tecla" onclick="digitar('3')">3</button>
            <button type="button" class="tecla" onclick="digitar('4')">4</button>
            <button type="button" class="tecla" onclick="digitar('5')">5</button>
            <button type="button" class="tecla" onclick="digitar('6')">6</button>
            <button type="button" class="tecla" onclick="digitar('7')">7</button>
            <button type="button" class="tecla" onclick="digitar('8')">8</button>
            <button type="button" class="tecla" onclick="digitar('9')">9</button>
            <button type="button" class="tecla tecla-limpar" onclick="limpar()"><i class="fa-solid fa-delete-left"></i></button>
            <button type="button" class="tecla" onclick="digitar('0')">0</button>
            <button type="button" class="tecla" onclick="backspace()"><i class="fa-solid fa-backspace"></i></button>
        </div>

        <div class="resultado erro" id="erro-retirar"></div>
    </section>

    <!-- TELA 3 — Sucesso -->
    <section id="tela-sucesso" class="tela">
        <div class="sucesso-icon"><i class="fa-solid fa-circle-check"></i></div>
        <h2 class="tela-titulo">Pode retirar!</h2>
        <p class="tela-sub" id="sucesso-cliente"></p>

        <div class="porta-box">
            <span class="porta-label">Compartimento</span>
            <span class="porta-numero" id="sucesso-porta">—</span>
        </div>

        <p class="totem-dica">Feche a porta ao terminar</p>
        <p class="contagem" id="contagem">Voltando em <span id="segundos">15</span>s</p>
    </section>

</div>

<script>
const ARMARIO_ID = document.querySelector(".totem").dataset.armarioId || "";
let codigo = "";
let idleTimer = null;
let contagemTimer = null;
const IDLE_MS = 60000;

function mostrarTela(id){
    document.querySelectorAll(".tela").forEach(t => t.classList.remove("tela-ativa"));
    document.getElementById(id).classList.add("tela-ativa");
    resetIdle();
}

function irInicio(){
    limpar();
    document.getElementById("erro-retirar").classList.remove("visivel");
    if(contagemTimer) clearInterval(contagemTimer);
    mostrarTela("tela-inicio");
}

function irRetirar(){
    mostrarTela("tela-retirar");
    limpar();
}

function resetIdle(){
    if(idleTimer) clearTimeout(idleTimer);
    idleTimer = setTimeout(irInicio, IDLE_MS);
}

function atualizarDisplay(){
    document.getElementById("display").textContent =
        codigo.padEnd(6, "_").split("").join(" ");
}

function digitar(n){
    if(codigo.length >= 6) return;
    codigo += n;
    atualizarDisplay();
    document.getElementById("erro-retirar").classList.remove("visivel");
    if(codigo.length === 6) setTimeout(confirmar, 250);
}

function limpar(){
    codigo = "";
    atualizarDisplay();
}

function backspace(){
    codigo = codigo.slice(0, -1);
    atualizarDisplay();
}

function mostrarErro(msg){
    const el = document.getElementById("erro-retirar");
    el.textContent = msg;
    el.classList.add("visivel");
}

function irSucesso(data){
    document.getElementById("sucesso-cliente").textContent = data.cliente || "";
    document.getElementById("sucesso-porta").textContent = data.compartimento || "—";
    mostrarTela("tela-sucesso");

    let s = 15;
    document.getElementById("segundos").textContent = s;
    if(contagemTimer) clearInterval(contagemTimer);
    contagemTimer = setInterval(() => {
        s--;
        document.getElementById("segundos").textContent = s;
        if(s <= 0) irInicio();
    }, 1000);
}

function confirmar(){
    if(codigo.length !== 6){
        mostrarErro("Digite os 6 dígitos.");
        return;
    }

    let body = "codigo=" + encodeURIComponent(codigo);
    if(ARMARIO_ID) body += "&armario_id=" + encodeURIComponent(ARMARIO_ID);

    fetch("/totem/retirar", {
        method: "POST",
        headers: {"Content-Type": "application/x-www-form-urlencoded"},
        body: body
    })
    .then(r => r.json())
    .then(data => {
        if(data.sucesso){
            irSucesso(data);
        } else {
            mostrarErro(data.mensagem || "Código inválido.");
            codigo = "";
            atualizarDisplay();
        }
    })
    .catch(() => mostrarErro("Sem conexão com o servidor."));
}

document.addEventListener("keydown", e => {
    if(!document.getElementById("tela-retirar").classList.contains("tela-ativa")) return;
    if(e.key >= "0" && e.key <= "9") digitar(e.key);
    if(e.key === "Backspace") backspace();
    if(e.key === "Enter") confirmar();
    if(e.key === "Escape") irInicio();
});

document.addEventListener("click", resetIdle);
document.addEventListener("touchstart", resetIdle);
resetIdle();
</script>

</body>
</html>
