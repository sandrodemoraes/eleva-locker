# Copie para config.tunnel.yml e ajuste o Tunnel ID.
# Credenciais: geradas por "cloudflared tunnel login" / "tunnel create"
# normalmente em C:\Users\terminal\.cloudflared\<TUNNEL_ID>.json

tunnel: SEU_TUNNEL_ID
credentials-file: C:\Users\terminal\.cloudflared\SEU_TUNNEL_ID.json

ingress:
  # Site Eleva Cam (Flask local)
  - hostname: elevacam.elevalocker.com.br
    service: http://127.0.0.1:15000
  # obrigatório: catch-all
  - service: http_status:404
