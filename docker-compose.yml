services:
  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-eleva}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-eleva}
      POSTGRES_DB: ${POSTGRES_DB:-elevalocker}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U eleva -d elevalocker"]
      interval: 5s
      timeout: 5s
      retries: 5

  web:
    build: .
    ports:
      - "15000:15000"
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-eleva}:${POSTGRES_PASSWORD:-eleva}@db:5432/${POSTGRES_DB:-elevalocker}
      SECRET_KEY: ${SECRET_KEY:-ElevaLocker2026}
      SKIP_BACKUP: "1"
      ESP32_MODO_SIMULACAO: "1"
      NOTIF_MODO: console
      PAGAMENTO_MODO: console
    depends_on:
      db:
        condition: service_healthy

  # Evolution API — WhatsApp (opcional)
  # Suba com: docker compose --profile whatsapp up -d
  # Depois acesse http://localhost:8080, crie instância e escaneie QR
  evolution-api:
    profiles: ["whatsapp"]
    image: atendai/evolution-api:latest
    ports:
      - "8080:8080"
    environment:
      AUTHENTICATION_API_KEY: ${WHATSAPP_API_KEY:-eleva-evolution-key}
      SERVER_URL: http://localhost:8080
    volumes:
      - evolution_data:/evolution/instances

volumes:
  pgdata:
  evolution_data:
